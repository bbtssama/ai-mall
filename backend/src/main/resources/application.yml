server:
  port: 8080

spring:
  profiles:
    # 默认激活 local：真实密钥放在 application-local.yml（不入库），mvn spring-boot:run 直接跑即可。
    # 若将来部署生产，用命令行覆盖：--spring.profiles.active=prod
    active: local
  application:
    name: ai-mall-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 开发库：192.168.6.102（与 order-system-v2 / blog-system 同一台 MySQL）
    url: jdbc:mysql://192.168.6.102:3306/ai_mall?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root123}
  ai:
    openai:
      # OpenCode Go 中转（opencode.ai/zen/go 订阅，OpenAI 兼容协议）。
      # 注意：base-url 不带 /v1，Spring AI 会自动拼接 /v1/chat/completions。
      # 官方 DeepSeek 直连可改回 https://api.deepseek.com（模型 deepseek-chat）。
      #base-url: https://opencode.ai/zen/go
      # API Key 一律通过环境变量 DEEPSEEK_API_KEY 注入，禁止硬编码入库（GitHub 推送保护会拦截）。
      # 本地开发：密钥写入 application-local.yml（已被 .gitignore 忽略），默认已激活，直接启动即可。
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY:}

      chat:
        options:
          model: deepseek-v4-flash-vision-exp
          temperature: 0.7
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 语音引擎（com.aimall.voice）
# 运行时说明：主路径需要派蒙音色（派蒙 6k VITS）——须先启动 PaimonLiveWeb5 的 VITS 侧车
#   (scripts/vits_server.py，默认 http://127.0.0.1:9944) 或其派蒙后端(:18781)，否则 TTS 会
#   回退到本地 Edge-TTS（非派蒙音色，仅兜底）。如需关闭回退只需把派蒙后端指到不可达地址。
aimall:
  voice:
    tts:
      # 派蒙音色主路径：复用 PaimonLiveWeb5 后端 /api/tts（:18781，内部 mode=vits 走派蒙6k VITS
      #   + Edge-TTS 回退，返回 audio/mpeg）。也可指向 ../vits_server.py 的 /tts（但返回 wav，需自行转 mp3）。
      backend-url: http://127.0.0.1:18781/api/tts
      # 派蒙后端连接/读取超时（ms）
      backend-connect-timeout-ms: 3000
      backend-read-timeout-ms: 60000
      # 兜底音色（本地 Edge-TTS，仅当派蒙后端不可用时才用）：默认 zh-CN-XiaoyiNeural 活泼女声
      voice: zh-CN-XiaoyiNeural
      # 兜底 Edge-TTS 同时合成上限：edge/微软接口并发会整批失败，默认串行（1），可放宽到 2
      max-concurrency: 1
      # 兜底 Edge-TTS 单次失败的重试次数（不含首试），退避 retry-backoff-ms × 尝试轮次
      retry-attempts: 2
      retry-backoff-ms: 500

sa-token:
  # token 名称（前端请求头），默认 Authorization；Sa-Token 会兼容 "Bearer " 前缀
  token-name: Authorization
  timeout: 604800          # token 有效期 7 天（秒）
  active-timeout: -1       # 无活跃期限制
  is-concurrent: true      # 允许多端登录
  is-share: false
  token-style: uuid
  is-log: false

logging:
  level:
    com.aimall: info