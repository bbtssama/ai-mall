server:
  port: 8080

spring:
  profiles:
    # 默认激活 local：真实密钥放在 application-local.yml（不入库），mvn spring-boot:run 直接跑即可。
    # 若将来部署生产，用命令行覆盖：--spring.profiles.active=prod
    active: local
  application:
    name: ai-mall-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 开发库：192.168.6.102（与 order-system-v2 / blog-system 同一台 MySQL）
    url: jdbc:mysql://192.168.6.102:3306/ai_mall?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root123}

  # ===== V1.5：Flyway 数据库版本管理 =====
  # 表结构变更一律走 backend/src/main/resources/db/migration/Vx__xxx.sql，不再手工执行 SQL。
  # baseline-on-migrate=true 的作用：
  #   1) 空库（新环境）→ 正常执行 V1__init.sql 建表；
  #   2) 已有表的存量库（本项目当前的开发库）→ 自动"基线化"到版本 1，
  #      把 V1 视为已执行，不会重复建表、也不会报"表已存在"。
  # 这是把 Flyway 引入【已有项目】的标准做法，面试可讲。
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
    # 校验失败时不阻断启动（例如有人手改了已执行过的迁移文件）
    validate-on-migrate: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

  # ===== V3：Redis =====
  # 本地虚拟机 192.168.6.102:6381（有密码 123456）。未启动时 RedisOps 统一降级走 DB，应用照常运行。
  data:
    redis:
      host: ${REDIS_HOST:192.168.6.102}
      port: ${REDIS_PORT:6381}
      password: ${REDIS_PASSWORD:123456}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16     # 最大连接数
          max-idle: 8        # 最大空闲连接
          min-idle: 2        # 最小空闲连接（预热，避免突发请求新建连接的延迟）
          max-wait: 2000ms   # 拿连接的最长等待

  # ===== V2：RabbitMQ（AI 内容审核异步化）=====
  # ★ 可插拔：未启动 RabbitMQ 时发布接口照常工作（自动降级为线程池异步审核）。
  # spring-amqp 连接失败会自动后台重连，不阻断应用启动。
  rabbitmq:
    host: ${RABBITMQ_HOST:192.168.6.102}
    port: ${RABBITMQ_PORT:5673}
    username: ${RABBITMQ_USER:admin}
    password: ${RABBITMQ_PASSWORD:123456}
    # 发布者确认：消息到达 Broker 才算发送成功（"不丢"的发送端一半）
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        # 消费失败不重入队（防毒消息循环；失败兜底=死信队列+ERROR流水，见 AuditConsumer）
        default-requeue-rejected: false
        prefetch: 5        # 审核是秒级慢任务，预取太多会堆积在客户端内存

  ai:
    openai:
      # 当前生效：官方 DeepSeek 直连（https://api.deepseek.com），模型见下方 chat.options.model。
      # 备用通道：OpenCode Go 中转（opencode.ai/zen/go 订阅，OpenAI 兼容协议），取消下一行注释即可切换。
      # 注意：base-url 不带 /v1，Spring AI 会自动拼接 /v1/chat/completions。
      #base-url: https://opencode.ai/zen/go
      # API Key 一律通过环境变量 DEEPSEEK_API_KEY 注入，禁止硬编码入库（GitHub 推送保护会拦截）。
      # 本地开发：密钥写入 application-local.yml（已被 .gitignore 忽略），默认已激活，直接启动即可。
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY:}

      chat:
        options:
          model: deepseek-v4-flash-vision-exp
          temperature: 0.7
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 语音引擎（com.aimall.voice）：自包含派蒙音色（t18）
# 主路径 = 本机内嵌派蒙 VITS（ai-mall/voice-tts/，由 VitsLifecycle 在后端启动时自动拉起）。
#   运行时说明：需在 voice-tts/ 放置模型并安装依赖（pip install -r voice-tts/requirements.txt），详见 README。
#   若机器无 Python/模型/依赖 → 后端照常启动，TTS 自动回退本地 Edge-TTS（非派蒙音色，仅兜底）。
aimall:
  voice:
    tts:
      # 派蒙音色主路径：本机内嵌 VITS（:9944/tts 返回 wav，PaimonBackendTtsClient 用 ffmpeg 转 mp3）。
      # 由 VitsLifecycle 在 /health 就绪后“指向本机 VITS”实现运行时激活。
      backend-url: http://127.0.0.1:9944/tts
      # 本机 VITS 连接/读取超时（ms）
      backend-connect-timeout-ms: 3000
      backend-read-timeout-ms: 60000
      # 内嵌 VITS 服务（vits_server.py）拉起相关
      vits:
        port: 9944
        # Python 解释器：★必须显式指向装好 torch/fastapi/uvicorn/soundfile 的解释器。
        # 不能裸写 python（PATH 漂移）：曾因 PATH 上的 python 变成无依赖的 3.13，
        # spawn 出的进程 ModuleNotFoundError: soundfile 直接死掉，TTS 静默降级 Edge-TTS。
        python: ${AIMALL_VITS_PYTHON:G:/tts/env/python.exe}
        # 内嵌 VITS 目录：相对后端工作目录（从 ai-mall/backend 启动时会向上解析到 ai-mall/voice-tts）
        script-dir: voice-tts
        # /health 就绪轮询：超时与间隔（ms）
        health-timeout-ms: 90000
        health-interval-ms: 1500
        # 是否用 ffmpeg 把 wav 转 mp3（满足 audio/mpeg 契约）；无 ffmpeg 时直接回 wav
        ffmpeg-enabled: true
        ffmpeg-path: ffmpeg
        # VITS 进程 stdout/stderr 日志文件名（落到 voice-tts 目录下）
        log: vits-server.log
      # 兜底音色（本地 Edge-TTS，仅当本机 VITS 不可用时才用）：默认 zh-CN-XiaoyiNeural 活泼女声
      voice: zh-CN-XiaoyiNeural
      # 兜底 Edge-TTS 同时合成上限：edge/微软接口并发会整批失败，默认串行（1），可放宽到 2
      max-concurrency: 1
      # 兜底 Edge-TTS 单次失败的重试次数（不含首试），退避 retry-backoff-ms × 尝试轮次
      retry-attempts: 2
      retry-backoff-ms: 500

  # ===== V1.5：对象存储（StorageService 抽象层）=====
  # type=local 为零依赖默认实现，直接能跑；切 minio 只需改这里 + 填 minio 配置，业务代码零改动。
  storage:
    type: local                        # local | minio
    max-size-bytes: 10485760           # 单文件上限 10MB
    allowed-content-types:             # 白名单（防存储型 XSS）
      - image/jpeg
      - image/png
      - image/webp
      - image/gif
    local:
      root: ./uploads                  # 落盘目录（同时映射到 /files/** 供访问）
      url-prefix: /files
    minio:
      endpoint:                        # 如 http://192.168.6.102:9000
      access-key:
      secret-key:
      bucket: aimall
      url-prefix:                      # 留空则生成预签名 URL（7 天有效），适合私有桶

  # 日志目录（logback-spring.xml 通过 springProperty 读取）
  logging:
    dir: ./logs

  # ===== V3：支付 =====
  pay:
    default-channel: MOCK            # 默认渠道（MOCK 零依赖可跑通）
    mock:
      # 模拟渠道的 HMAC 签名密钥（生产环境务必改为环境变量注入）
      secret: ${AIMALL_PAY_MOCK_SECRET:aimall-mock-secret}
      cashier-url: /mock-cashier     # 前端模拟收银台路由

  # ===== V2：RAG 配置 =====
  # embedding 默认 local（零依赖哈希向量，字面相似）；
  # 配置真实 embedding 服务后改 spring-ai（语义相似，质量显著更好），业务代码零改动。
  rag:
    enabled: true
    embedding: local          # local | spring-ai
    dimension: 256
    top-k: 5                  # 最终拼进 prompt 的片段数
    candidate-k: 20           # 每路召回的候选数
    rrf-k: 60                 # RRF 融合常数（论文推荐值）
    vector-cache-seconds: 300
    max-chunk-chars: 800

sa-token:
  # token 名称（前端请求头），默认 Authorization；Sa-Token 会兼容 "Bearer " 前缀
  token-name: Authorization
  timeout: 604800          # token 有效期 7 天（秒）
  active-timeout: -1       # 无活跃期限制
  is-concurrent: true      # 允许多端登录
  is-share: false
  token-style: uuid
  is-log: false

logging:
  level:
    com.aimall: info
    org.springframework.web: info
    io.minio: warn

# ===== V1.5：可观测性（Actuator）=====
# 作用：健康检查、指标、优雅下线 —— 没有它，运维无法判断"服务活着还是假死"。
# 排障入口：GET /actuator/health 、GET /actuator/metrics
management:
  endpoints:
    web:
      exposure:
        # 生产请收窄到 health,info；这里为方便本地演示多开两个
        include: health,info,metrics,beans
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true          # /actuator/health/liveness 、/readiness（K8s 探针用）
  metrics:
    tags:
      application: ${spring.application.name}