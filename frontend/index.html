<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!--
    图标：内联 SVG（data URI），零外部依赖、离线可用，与顶栏 🧬 Logo 一致。
    此前没有 favicon 也没声明 icon，浏览器每次都会去请求 /favicon.ico 拿 404，
    控制台因此每页都留一条红字报错。
  -->
  <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧬</text></svg>" />
  <title>AI 种草商城</title>
</head>
<body>
  <div id="app"></div>

  <!--
    【渲染栈】pixi.js@7 + pixi-live2d-display@0.5.0-beta（ESM，构建期打包，无 CDN）。
    此处仅保留 Cubism Core 运行时全局（window.Live2DCubismCore），须最先加载（在 /src/main.js 之前）。
    公开仓库不含该受限资产时脚本 404：onerror 仅记录警告（不影响其它模块），Live2D 侧由 voiceStage.vue
    动态 import 并优雅降级，聊天/图片/工具检索/会话照常。
  -->
  <script src="/vendor/live2dcubismcore.min.js"
          onerror="console.warn('Live2D Cubism Core 未加载（资产未提供）：皮套降级为纯文字聊天');"></script>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
