server:
  port: 8081        # ai-service 独立端口（mall-app 是 8080）

spring:
  application:
    name: ai-service
  profiles:
    # 默认激活 local：真实密钥放在 application-local.yml（不入库），与 backend 同一套机制。
    # 生产用命令行覆盖：--spring.profiles.active=prod（或环境变量 DEEPSEEK_API_KEY）
    active: local

  # ===== Nacos：启动即注册（服务名 ai-service）=====
  # fail-fast=false：Nacos 不在→打 WARN 照常启动（客户端自动重连，恢复后自动补注册）
  cloud:
    nacos:
      discovery:
        enabled: true
        server-addr: ${NACOS_ADDR:192.168.6.102:8848}
        ip: ${NACOS_REGISTER_IP:192.168.6.1}   # ★ 多网卡机器必须指定：自动选择会选中 VMware 虚拟网卡(192.168.49.1)，跨机器不可达
        fail-fast: false

  # ===== 数据源：本服务独享 t_knowledge_*（AI 域资产），与 mall-app 同实例不同表 =====
  datasource:
    url: jdbc:mysql://192.168.6.102:3306/ai_mall?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root123

  # ===== Spring AI：官方 DeepSeek 直连（与 V1 同配置：文本/视觉同一模型）=====
  ai:
    openai:
      # 真实密钥在 application-local.yml（gitignore 忽略，默认激活）；
      # 环境变量注入优先于 local 文件（部署无 local 文件时的通道）
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      api-key: ${DEEPSEEK_API_KEY:}
      chat:
        options:
          model: deepseek-v4-flash-vision-exp
          temperature: 0.7

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

# ===== 内部调用鉴权：与 mall-app 共享密钥（生产用环境变量注入）=====
aimall:
  internal:
    secret: ${AIMALL_INTERNAL_SECRET:aimall-internal-secret}
    client-id: ai-service
  # mall-app 地址：★ 静态直连（无注册中心也能跑）；接入 Nacos 后可改为服务名
  mall:
    base-url: ${MALL_BASE_URL:http://localhost:8080}
  # RAG：与 V2 同配置（embedding 可插拔：local 哈希 / spring-ai 真实模型）
  rag:
    enabled: true
    embedding: local
    dimension: 256
    top-k: 5
    candidate-k: 20
    rrf-k: 60

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.aimall: INFO
